name: list_smith_example
description: "Runnable example app for the list_smith package."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  list_smith:
    path: ../

  pmvvm: ^4.0.1
  platform_adaptive_widgets: ^2.2.0
  material_ui: ^1.0.0
  cupertino_ui: ^1.1.1
  platform_icons: ^0.1.1
  listenable_collections: ^3.0.0
  flutter_slidable: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  checks: ^0.3.2
  dartender_lints:
    git:
      url: https://github.com/LahaLuhem/dartender.git
      path: lints
      ref: main
  dependency_validator: ^5.1.0

flutter:
  uses-material-design: true
