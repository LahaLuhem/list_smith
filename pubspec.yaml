name: list_smith
description: >-
  A developer-first Flutter list, built lazily like ListView.builder, with async
  pagination, pull-to-refresh, and sync-or-async search.
version: 2.0.1
homepage: https://github.com/LahaLuhem/list_smith?tab=readme-ov-file
repository: https://github.com/LahaLuhem/list_smith
issue_tracker: https://github.com/LahaLuhem/list_smith/issues

topics:
  - listview
  - pagination
  - infinite-scroll
  - pull-to-refresh
  - search

screenshots:
  - description: >-
      Paging and pull-to-refresh, with Material on the left and Cupertino on the right.
    path: doc/screenshots/feed.webp
  - description: >-
      Editing loaded rows: adding one, swiping one away and renaming another.
    path: doc/screenshots/edits.webp
  - description: >-
      Searching a list in memory, then grouping the results into labelled sections.
    path: doc/screenshots/search.webp

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  custom_refresh_indicator: ^4.0.2
  collection: ^1.19.1
  meta: ^1.18.0
  pool: ^1.5.3
  multi_value_listenable_builder_typed: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bdd_framework: ">=4.0.7 <6.0.0"
  benchmark_harness: ^2.4.0
  checks: ^0.3.2
  dartender_lints:
    git:
      url: https://github.com/LahaLuhem/dartender.git
      path: lints
      ref: main
  dependency_validator: ^5.1.0
  fake_async: ^1.3.3
  analyzer: ^14.7.0

cider:
  link_template:
    tag: https://github.com/LahaLuhem/list_smith/releases/tag/%tag%
    diff: https://github.com/LahaLuhem/list_smith/compare/%from%...%to%
