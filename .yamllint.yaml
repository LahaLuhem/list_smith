# ryl (YAML lint) config, in yamllint's format. Its defaults, bent to fit the repo's YAML rather
# than the other way round.
extends: default

rules:
  # 100 columns, matching .editorconfig. Long single-token URLs in comments stay
  # exempt via yamllint's allow-non-breakable-words default.
  line-length:
    max: 100
  # Workflows use `on:`, which reads as a truthy key, so only values are checked.
  truthy:
    check-keys: false
  # Single-document files here don't lead with `---`.
  document-start: disable
