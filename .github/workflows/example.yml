name: Example checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}-example
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: example

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          working-directory: example
      - run: flutter --no-version-check analyze .

  deps:
    name: Dependency validator (example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          working-directory: example
      # Same git-branch activation as package.yml; see the note there.
      - run: |
          dart pub global activate --source git \
            https://github.com/Workiva/dependency_validator \
            --git-ref dependabot/pub/major-0f75c2771b
      - run: dart pub global run dependency_validator

  # main's required check; the job id IS the context, so no `name:` and no rename.
  # APPENDIX.md#dependabot-automerge
  example-ok:
    needs: [analyze, deps]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    # The file-level default points at example/, which this job never checks out.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: >-
            analyze=${{ needs.analyze.result }}
            deps=${{ needs.deps.result }}
        run: |
          echo "$RESULTS"
          exit 1
