name: Update changelog

on:
  pull_request_target:
    types: [closed]
    branches: [main]

# Serialized, and never cancelled: every merged PR must actually get its line.
concurrency:
  group: changelog-main
  cancel-in-progress: false

# pull_request_target for write scopes on fork PRs. Safe because the workflow loads from main
# and PR code is never checked out, so the token never meets PR-controlled scripts.
permissions:
  contents: write

jobs:
  log:
    name: Append cider entry
    # Bot PRs carry no sem-* label, so there's no cider type to resolve. Add an entry by hand if
    # a root-package bump turns out to be user-visible.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve sem-* label → cider type
        id: sem
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          sem=$(echo "$LABELS" | jq -r '.[] | select(startswith("sem-"))' | head -n1)
          case "$sem" in
            sem-skip)      echo 'type=skip'       >> "$GITHUB_OUTPUT" ;;
            sem-add)       echo 'type=added'      >> "$GITHUB_OUTPUT" ;;
            sem-change)    echo 'type=changed'    >> "$GITHUB_OUTPUT" ;;
            sem-deprecate) echo 'type=deprecated' >> "$GITHUB_OUTPUT" ;;
            sem-remove)    echo 'type=removed'    >> "$GITHUB_OUTPUT" ;;
            sem-bugfix)    echo 'type=fixed'      >> "$GITHUB_OUTPUT" ;;
            sem-security)  echo 'type=security'   >> "$GITHUB_OUTPUT" ;;
            *)
              if [ -z "$sem" ]; then
                msg="PR has no sem-* label. pr-conventions should have blocked this - investigate."
                echo "::error::$msg"
              else
                echo "::error::Unrecognized sem-* label: '$sem'."
              fi
              exit 1
              ;;
          esac

      - name: Skip (sem-skip)
        if: steps.sem.outputs.type == 'skip'
        run: echo 'sem-skip applied, no changelog entry.'

      # An App token, not GITHUB_TOKEN: the ruleset's "Apps" bypass tab can list the App, but not
      # `github-actions[bot]`, whose direct pushes branch protection blocks. Owner/repositories are
      # written out so the token's reach can't widen under us (hard rule 8). Lives ~1 h.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: steps.sem.outputs.type != 'skip'
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          skip-token-revoke: false

      # The only checkout in the repo that keeps credentials: the App token has to survive into
      # the `git push` below. Hard rule 8.
      - uses: actions/checkout@v7
        if: steps.sem.outputs.type != 'skip'
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      # cider comes from `pub global activate`, so no project deps and no setup-flutter composite.
      - uses: dart-lang/setup-dart@v1
        if: steps.sem.outputs.type != 'skip'
        with:
          sdk: stable

      - name: Activate cider
        if: steps.sem.outputs.type != 'skip'
        run: dart pub global activate cider

      - name: Append entry and push
        if: steps.sem.outputs.type != 'skip'
        env:
          TYPE: ${{ steps.sem.outputs.type }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The email's numeric prefix is the bot's GitHub user ID, which is what links commits
          # to the App's avatar. Look up: api.github.com/users/<slug>%5Bbot%5D | jq .id
          git config user.name  '${{ steps.app-token.outputs.app-slug }}[bot]'
          email='287673903+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git config user.email "$email"
          dart pub global run cider log "$TYPE" "$TITLE"
          git add CHANGELOG.md
          # [skip ci] matters here: App-token pushes DO trigger workflows, unlike GITHUB_TOKEN
          # ones, so without it this commit re-triggers the package CI on main.
          git commit -m 'Changelog updated [skip ci]'
          git push origin HEAD:main
