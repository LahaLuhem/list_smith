name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+' # tag-pattern on pub.dev: '{{version}}'

# Inlined rather than reusing dart-lang/setup-dart's publish workflow: that one runs `pub get`
# without `--no-example`, which resolves `example/` against CI's Flutter instead of the
# `.fvmrc`-pinned one and rewrites `example/pubspec.lock`, tripping `--dry-run`'s
# "checked-in files are modified" guard. `flutter pub get` (not `dart`) satisfies the
# `flutter: sdk: flutter` constraint; setup-dart stays first so its OIDC env precedes publish.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC auth to pub.dev (configured by dart-lang/setup-dart).
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies (root only, skip example/)
        run: flutter --no-version-check pub get --no-example
      - name: Publish dry-run
        run: flutter --no-version-check pub publish --dry-run
      - name: Publish to pub.dev
        run: flutter --no-version-check pub publish --force
