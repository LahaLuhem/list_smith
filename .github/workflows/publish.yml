# Written by dartender's scripts/setup/callers.sh, whose next run undoes hand edits.
name: Publish

on:
  push:
    # pub.dev's tag patterns: a bare version where the repo publishes one package, and
    # `<package>-<version>` where it publishes more.
    tags: ["[0-9]+.[0-9]+.[0-9]+", "*-[0-9]+.[0-9]+.[0-9]+"]

jobs:
  publish:
    uses: LahaLuhem/dartender/.github/workflows/publish.yml@main
    # The OIDC token pub.dev takes instead of a login.
    permissions:
      contents: read
      id-token: write
