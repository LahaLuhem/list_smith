name: Benchmark regression

# Micro-benchmark regression tripwire. Builds the AOT micros for both the PR head and origin/main,
# then measures them INTERLEAVED on the SAME runner (VMs vary ~2.7x run-to-run, so a cross-machine
# baseline would drown real regressions; alternating the sides stops a mid-job shift landing on
# one of them), then fails the job if any metric regressed significantly. The macOS-only,
# timing-flaky scenario drives are deliberately NOT run here; they stay local.

on:
  pull_request:
    branches: [main]
    # Only the code whose timing this gate measures: the measured library, the micro entrypoints,
    # and the shared harness. A PR touching only benchmark/python, the host app, docs, or other CI
    # has no micro-timing delta to catch, so it skips this expensive same-runner gate (build + run
    # the micros twice, ~4 min each side; see issue #4 / PR #10).
    paths:
      - lib/**
      - benchmark/micro/**
      - benchmark/harness/**
      - .github/workflows/benchmark.yml

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  micro-regression:
    name: Micro-benchmark regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      # Full-version pin: v8+ dropped the floating @v8 tag. `latest-known` = newest uv whose
      # checksum this action ships, so the install is always verified. Hard rule 8.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: latest-known
          enable-cache: true
          prune-cache: false
          download-from-astral-mirror: true
      # Pin the bare-python build/run steps to the analyzer's floor (.python-version), not
      # whatever the runner ships. `update-environment` is what makes `python3` that one.
      - uses: actions/setup-python@v7
        with:
          python-version-file: benchmark/python/.python-version
          update-environment: true

      # Build both sides first, then measure them interleaved. build uses only the stdlib
      # (subprocess + json), so no analysis venv is needed here; scipy for compare syncs later.
      - name: Build micros - candidate (PR head)
        working-directory: benchmark/python
        run: python3 run.py build

      # Baseline: the SAME micros on origin/main, in a worktree, on THIS runner. Skips cleanly if
      # main has no suite yet (the bootstrap PR adding this), so the gate never errors on absence.
      - name: Build micros - baseline (origin/main)
        id: baseline
        run: |
          git fetch --no-tags --depth=1 origin main
          git worktree add "$RUNNER_TEMP/base" origin/main
          if [ ! -f "$RUNNER_TEMP/base/benchmark/python/run.py" ]; then
            echo "origin/main has no benchmark suite yet; skipping the regression gate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$RUNNER_TEMP/base/benchmark/python"
          python3 run.py build

      # One pass over both builds, alternating sides every iteration, so anything that shifts
      # mid-job lands on both equally instead of on whichever ran first (issue #43).
      - name: Micros - interleaved
        if: steps.baseline.outputs.skip != 'true'
        working-directory: benchmark/python
        run: |
          python3 run.py ab \
            --candidate-build ../build \
            --baseline-build "$RUNNER_TEMP/base/benchmark/build" \
            --candidate-out "$RUNNER_TEMP/candidate" \
            --baseline-out "$RUNNER_TEMP/baseline" \
            --scratch "$RUNNER_TEMP/ab"

      # Gate: diff baseline vs candidate, fail on a significant regression. Needs the analysis
      # stack, so sync it here. Artifacts go to a temp dir, never the committed reports/.
      - name: Compare and gate
        if: steps.baseline.outputs.skip != 'true'
        working-directory: benchmark/python
        run: |
          uv sync
          uv run python run.py compare \
            "$RUNNER_TEMP/baseline/aggregated.json" \
            "$RUNNER_TEMP/candidate/aggregated.json" \
            --out "$RUNNER_TEMP/compare" \
            --fail-on-regression

      # Keep the compare artifacts (forest chart + COMPARE.md) even when the gate fails, so a
      # flagged regression is inspectable from the run instead of lost in the step log. The raw
      # per-side runs go up too: every record carries `started_at`, so a flake can be diagnosed
      # from the artifact after the fact instead of argued about (issue #43).
      - name: Upload compare artifacts
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: micro-compare
          path: |
            ${{ runner.temp }}/compare
            ${{ runner.temp }}/candidate/aggregated.json
            ${{ runner.temp }}/baseline/aggregated.json
          if-no-files-found: warn
