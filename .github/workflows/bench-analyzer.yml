name: Benchmark analyzer tests

# No `paths:` filter: a filtered run never reports on a PR outside it, blocking the required check.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyzer-tests:
    name: Analyzer unit tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: LahaLuhem/dartender/actions/setup-python-uv@main
        with:
          working-directory: benchmark/python
      # The fail-under threshold is here so local single-test runs aren't blocked by it.
      - name: pytest + coverage gate
        working-directory: benchmark/python
        run: uv run pytest --cov-fail-under=90

  # The ruleset requires this job's id, so no `name:` and no rename.
  bench-analyzer-ok:
    needs: [analyzer-tests]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: analyzer-tests=${{ needs.analyzer-tests.result }}
        run: echo "$RESULTS"
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
