name: Setup Flutter
description: >-
  Install the Flutter SDK (which includes Dart), restore the pub cache, and run
  `flutter pub get`. The caller is responsible for `actions/checkout` beforehand
  because local composite actions are only discoverable after checkout.

inputs:
  channel:
    description: Flutter channel. Defaults to the one `.fvmrc` pins for local FVM.
    required: false
    default: ''
  working-directory:
    description: Directory containing the `pubspec.yaml` to resolve. Defaults to the repo root.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    # .fvmrc is the single source for the SDK local dev uses; CI reads it rather than
    # keeping a second copy that drifts the moment either side moves.
    - name: Resolve channel
      id: sdk
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
      run: echo "channel=${CHANNEL:-$(jq -r .flutter .fvmrc)}" >> "$GITHUB_OUTPUT"

    - uses: subosito/flutter-action@v2
      with:
        channel: ${{ steps.sdk.outputs.channel }}
        cache: true

    - name: Cache .pub-cache
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        # Cache key is a single ${{ }}-composed value with no safe wrap point.
        key: pub-flutter-${{ runner.os }}-${{ hashFiles(format('{0}/pubspec.lock', inputs.working-directory)) }}  # yamllint disable-line rule:line-length
        restore-keys: |
          pub-flutter-${{ runner.os }}-
        # A cold cache must stay non-fatal, and we want a real restore, not a probe.
        fail-on-cache-miss: false
        lookup-only: false

    - name: flutter pub get
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter --no-version-check pub get
