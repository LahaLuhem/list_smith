# Written by dartender's scripts/setup/dependabot.sh, whose next run undoes hand edits.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /benchmark/app/android
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /example/android
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      pub:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /benchmark/app
    schedule:
      interval: weekly
    groups:
      pub:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /example
    schedule:
      interval: weekly
    groups:
      pub:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /benchmark/python
    schedule:
      interval: weekly
    groups:
      uv:
        patterns: ['*']
        update-types: [minor, patch]
